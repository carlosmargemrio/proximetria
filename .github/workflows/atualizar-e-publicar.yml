name: Atualizar base SICG e publicar

on:
  push:
    branches: ["main"]
  schedule:
    # O workflow acorda a cada 6 h, fora do início da hora.
    # O script só consulta o GeoServer quando >= 48 h desde a última consulta.
    - cron: "23 */6 * * *"
  workflow_dispatch:
    inputs:
      force_update:
        description: "Forçar consulta ao GeoServer agora, mesmo antes de 48 h?"
        required: true
        type: boolean
        default: true

permissions:
  contents: write
  pages: write
  id-token: write
  actions: read

concurrency:
  group: "proximetria-pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Preparar Python
        if: github.event_name != 'push'
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Instalar dependências
        if: github.event_name != 'push'
        run: pip install -r requirements.txt

      - name: Atualizar base do SICG
        if: github.event_name != 'push'
        shell: bash
        run: |
          set -euo pipefail
          FORCE=""
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.force_update }}" = "true" ]; then
            FORCE="--force"
          fi
          python scripts/atualizar_proximetria.py --min-hours 48 $FORCE
          python scripts/validar_dados.py

      - name: Registrar atualização no repositório
        if: github.event_name != 'push'
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- dados/; then
            echo "Nenhuma alteração de dados para registrar."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dados/
          git commit -m "dados: atualizar base SICG/IPHAN"
          git push

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v6

      - name: Enviar artefato do site
        uses: actions/upload-pages-artifact@v5
        with:
          path: "."

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Publicar no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
